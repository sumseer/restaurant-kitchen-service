<ul class="sidebar-nav list-group">
  {% if user.is_authenticated %}
    <li class="list-group-item d-flex flex-column">
      <div class="d-flex align-items-center mb-2">
        <i class="bi bi-person-circle me-2"></i>
        <span class="fw-bold">{{ user.username }}</span>
      </div>
      <div class="d-flex gap-2">
        <a href="{% url 'accounts:cook-detail' pk=user.id %}" 
           class="btn btn-sm btn-outline-primary flex-grow-1">
          <i class="bi bi-person-lines-fill"></i> Profile
        </a>
        <form action="{% url 'accounts:logout' %}" method="post" class="flex-grow-1">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-outline-danger w-100">
            <i class="bi bi-box-arrow-right"></i> Logout
          </button>
        </form>
      </div>
    </li>
  {% else %}
    <li class="list-group-item">
      <a href="{% url 'accounts:login' %}" class="btn btn-outline-success w-100">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </a>
    </li>
  {% endif %}

  <li class="list-group-item">
    <a href="{% url 'kitchen:index' %}" class="nav-link">
      <i class="bi bi-house-door me-2"></i> Home
    </a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'accounts:cook-list' %}" class="nav-link">
      <i class="bi bi-people me-2"></i> All Cooks
    </a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'kitchen:dish-type-list' %}" class="nav-link">
      <i class="bi bi-tags me-2"></i> Dish Types
    </a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'kitchen:dish-list' %}" class="nav-link">
      <i class="bi bi-egg-fried me-2"></i> All Dishes
    </a>
  </li>
</ul>
