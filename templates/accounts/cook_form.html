{% extends 'base.html' %}
{% load crispy_forms_filters %}

{% block content %}
<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h2 class="h4 mb-0">
        <i class="bi bi-person-{% if object %}badge{% else %}plus{% endif %} me-2"></i>
        {{ object|yesno:"Update,Create" }} Cook
      </h2>
    </div>
    <div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <div class="form-actions mt-4">
          <button type="submit" class="btn btn-primary me-2">
            <i class="bi bi-check-circle me-1"></i>
            {{ object|yesno:"Update,Create" }}
          </button>
          <a href="{% if object %}{% url 'accounts:cook-detail' pk=object.pk %}{% else %}{% url 'accounts:cook-list' %}{% endif %}" 
             class="btn btn-outline-secondary">
            <i class="bi bi-x-circle me-1"></i>
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
