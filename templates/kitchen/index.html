{% extends 'base.html' %}

{% block content %}
  <div class="container">
    <h1 class="my-4">Kitchen Service Home</h1>
    
    <div class="card mb-4">
      <div class="card-body">
        <p class="lead">Welcome to our restaurant kitchen management system</p>
        
        <h2 class="h4 mb-3">Dynamic content</h2>
        <p>Our kitchen currently has:</p>
        
        <ul class="list-group">
          <li class="list-group-item">
            <strong>Cooks:</strong> <span class="badge bg-primary">{{ num_cooks }}</span>
          </li>
          <li class="list-group-item">
            <strong>Dish types:</strong> <span class="badge bg-success">{{ num_dish_types }}</span>
          </li>
          <li class="list-group-item">
            <strong>Dishes:</strong> <span class="badge bg-info">{{ num_dishes }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
{% endblock %}
