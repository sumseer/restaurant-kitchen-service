{% extends 'base.html' %}

{% block content %}
  <div class="container mt-4">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white">
        <h1 class="h4 mb-0">Delete Dish Type</h1>
      </div>
      <div class="card-body">
        <p class="lead">Are you sure you want to delete the dish type: <strong>{{ dishtype }}</strong>?</p>
        <p class="text-muted">This action cannot be undone.</p>
        
        <div class="d-flex gap-3 mt-4">
          <form method="post" class="flex-grow-1">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger w-100">
              <i class="bi bi-trash-fill"></i> Yes, delete permanently
            </button>
          </form>
          
          <a href="{% url 'kitchen:dish-type-list' %}" class="btn btn-outline-secondary flex-grow-1">
            <i class="bi bi-x-circle"></i> No, cancel
          </a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
